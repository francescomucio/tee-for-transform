[project]
name = "t4t"
version = "0.1.2"
description = "t4t - Transform, Extract, Execute (and t-shirts!)"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
    {name = "Francesco Mucio", email = "francescomucio@gmail.com"},
]
keywords = ["sql", "data-transformation", "etl", "dbt-alternative", "data-pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "duckdb>=1.4.2",
    "jinja2>=3.1.0",
    "pydantic>=2.12.2",
    "pyyaml>=6.0.3",
    "sqlglot[rs]>=28.1.0",
    "toml>=0.10.2",
    "typer>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/francescomucio/tee-for-transform"
Documentation = "https://francescomucio.github.io/tee-for-transform/"
Repository = "https://github.com/francescomucio/tee-for-transform"
"Bug Tracker" = "https://github.com/francescomucio/tee-for-transform/issues"

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=4.1.1"]
postgres = ["psycopg2-binary>=2.9.0"]
bigquery = ["google-cloud-bigquery>=3.0.0"]
all = ["t4t[snowflake,postgres,bigquery]"]

[project.scripts]
t4t = "t4t.cli.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["t4t*"]
exclude = ["tests*", "examples*", "test_project*", "site*"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.22",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.3",
    "vulture>=2.14",
]

[tool.coverage.run]
source = ["t4t"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pytest.ini_options]
addopts = "--cov=t4t --cov-report=term-missing --cov-report=html"
# Exclude project directories from test discovery (these are example/demo projects, not test suites)
testpaths = ["tests"]
norecursedirs = ["examples", "test_project", ".venv", "venv", "__pycache__", ".git", "htmlcov", "site"]
filterwarnings = [
    # Suppress DuckDB deprecation warnings about _UnionGenericAlias (Python 3.14 beta issue)
    # These are internal DuckDB library warnings, not issues with our code
    # Match all DeprecationWarnings from duckdb module and submodules
    "ignore::DeprecationWarning:duckdb",
    "ignore::DeprecationWarning:duckdb.*",
    # Match by message content (regex pattern)
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
]

[tool.ruff]
# Enable linting and formatting
target-version = "py314"
line-length = 100

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Use spaces for indentation
indent-style = "space"
# Respect magic trailing comma
skip-magic-trailing-comma = false
# Automatic string normalization
line-ending = "auto"

[tool.ruff.lint]
# Enable linting rules
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

# Exclude common directories
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site",
    "venv",
    "htmlcov",
    "*.egg-info",
]

[tool.ruff.lint.per-file-ignores]
# Tests: unused params are often pytest fixtures (injected by name) or mock protocol stubs.
"tests/**" = ["ARG001", "ARG002"]
