site_name: Tee for Transform (t4t)
site_description: Transform, Extract, Execute — SQL transformations with multiple database backends
site_url: https://francescomucio.github.io/tee-for-transform/
repo_url: https://github.com/francescomucio/tee-for-transform
repo_name: francescomucio/tee-for-transform

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.arithmatex
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - admonition
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: README.md
  - Getting Started:
    - getting-started/installation.md
    - getting-started/quick-start.md
    - getting-started/quickstart.md
    - getting-started/configuration.md
    - getting-started/dbt-users-guide.md
  - User Guide:
    - user-guide/overview.md
    - user-guide/cli-reference.md
    - user-guide/execution-engine.md
    - user-guide/functions.md
    - user-guide/seeds.md
    - user-guide/data-quality-tests.md
    - user-guide/incremental-materialization.md
    - user-guide/database-adapters.md
    - user-guide/tags-and-metadata.md
    - user-guide/sql-dialect-conversion.md
    - user-guide/documentation-site.md
    - user-guide/dbt-import.md
    - user-guide/dbt-import-limitations.md
    - Examples:
      - user-guide/examples/README.md
      - user-guide/examples/basic-usage.md
      - user-guide/examples/functions.md
      - user-guide/examples/incremental-example.md
      - user-guide/examples/testing-example.md
  - API Reference:
    - api-reference/README.md
    - api-reference/functions.md
    - api-reference/models.md
    - api-reference/engine/README.md
    - api-reference/parser/README.md
    - api-reference/adapters/README.md
  - Development:
    - development/architecture.md
    - parser-model-flow.md
    - development/contributing.md
    - development/migration-guides/index.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/francescomucio/tee-for-transform
  version:
    provider: mike
